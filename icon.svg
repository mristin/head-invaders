<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1550"/>
      <stop offset="1" stop-color="#0b1a3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#7a4fd0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7a4fd0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="head" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#9df27a"/>
      <stop offset="1" stop-color="#45b84a"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#bff4ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#bff4ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="8" y="8" width="496" height="496" rx="96"/>
    </clipPath>
  </defs>

  <!-- The space -->
  <rect x="8" y="8" width="496" height="496" rx="96" fill="url(#space)"/>
  <circle cx="256" cy="215" r="230" fill="url(#glow)" clip-path="url(#card)"/>
  <g fill="#ffffff">
    <circle cx="78" cy="96" r="5" opacity="0.8"/>
    <circle cx="440" cy="72" r="4" opacity="0.7"/>
    <circle cx="452" cy="300" r="5" opacity="0.6"/>
    <circle cx="60" cy="330" r="4" opacity="0.6"/>
    <circle cx="120" cy="440" r="3" opacity="0.5"/>
    <circle cx="410" cy="430" r="3" opacity="0.5"/>
  </g>

  <!-- The friendly alien head, the invader -->
  <g stroke="#3a9a3f" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M196 98 Q178 58 150 46"/>
    <path d="M316 98 Q334 58 362 46"/>
  </g>
  <circle cx="148" cy="44" r="20" fill="#ff8fc4"/>
  <circle cx="364" cy="44" r="20" fill="#ff8fc4"/>
  <circle cx="142" cy="38" r="6" fill="#ffffff" opacity="0.7"/>
  <circle cx="358" cy="38" r="6" fill="#ffffff" opacity="0.7"/>

  <ellipse cx="256" cy="210" rx="150" ry="135" fill="url(#head)"/>
  <ellipse cx="200" cy="130" rx="44" ry="24" fill="#ffffff" opacity="0.25" transform="rotate(-20 200 130)"/>

  <ellipse cx="200" cy="205" rx="44" ry="52" fill="#ffffff"/>
  <ellipse cx="312" cy="205" rx="44" ry="52" fill="#ffffff"/>
  <circle cx="208" cy="218" r="25" fill="#1d1a3a"/>
  <circle cx="304" cy="218" r="25" fill="#1d1a3a"/>
  <circle cx="198" cy="206" r="9" fill="#ffffff"/>
  <circle cx="294" cy="206" r="9" fill="#ffffff"/>

  <circle cx="160" cy="272" r="18" fill="#ff7aa8" opacity="0.85"/>
  <circle cx="352" cy="272" r="18" fill="#ff7aa8" opacity="0.85"/>
  <path d="M220 280 Q256 312 292 280" stroke="#1d1a3a" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- The friendly beam of the spaceship -->
  <rect x="246" y="352" width="20" height="58" rx="10" fill="url(#beam)"/>

  <!-- The player's spaceship in its shield ring -->
  <circle cx="256" cy="440" r="50" fill="#1aa8e0" opacity="0.18"/>
  <circle cx="256" cy="440" r="50" fill="none" stroke="#38c6ff" stroke-width="9"/>
  <path d="M256 404 L284 466 L256 454 L228 466 Z" fill="#e8f6ff"/>
  <path d="M256 418 L268 446 L256 441 L244 446 Z" fill="#38c6ff"/>
</svg>
